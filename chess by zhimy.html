<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catur Buatan Zhimy</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f0f0f0;
    }
    h1 {
      margin: 20px;
      font-size: 24px;
    }
    #chessboard {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 90vmin;
      height: 90vmin;
      border: 2px solid #333;
    }
    .cell {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5vmin;
      user-select: none;
    }
    .white {
      background-color: #eee;
    }
    .black {
      background-color: #555;
      color: white;
    }
    .selected {
      outline: 3px solid red;
    }
  </style>
</head>
<body>
  <h1>Catur Buatan Zhimy</h1>
  <div id="chessboard"></div>  <script>
    const boardElement = document.getElementById('chessboard');
    const board = [];
    const pieces = {
      r: '♜', n: '♞', b: '♝', q: '♛', k: '♚', p: '♟',
      R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔', P: '♙'
    };

    let selected = null;
    let turn = 'white';

    const initialPosition = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ["","","","","","","",""],
      ["","","","","","","",""],
      ["","","","","","","",""],
      ["","","","","","","",""],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    function createBoard() {
      boardElement.innerHTML = '';
      for (let row = 0; row < 8; row++) {
        board[row] = [];
        for (let col = 0; col < 8; col++) {
          const cell = document.createElement('div');
          cell.className = 'cell ' + ((row + col) % 2 === 0 ? 'white' : 'black');
          cell.dataset.row = row;
          cell.dataset.col = col;
          cell.textContent = pieces[initialPosition[row][col]] || '';
          board[row][col] = initialPosition[row][col];
          cell.addEventListener('click', handleClick);
          boardElement.appendChild(cell);
        }
      }
    }

    function handleClick(e) {
      const cell = e.currentTarget;
      const row = parseInt(cell.dataset.row);
      const col = parseInt(cell.dataset.col);

      if (selected) {
        const [sRow, sCol] = selected;
        movePiece(sRow, sCol, row, col);
        selected = null;
        updateBoard();
      } else {
        if (board[row][col] !== '') {
          selected = [row, col];
          cell.classList.add('selected');
        }
      }
    }

    function movePiece(fromRow, fromCol, toRow, toCol) {
      board[toRow][toCol] = board[fromRow][fromCol];
      board[fromRow][fromCol] = '';
      turn = turn === 'white' ? 'black' : 'white';
    }

    function updateBoard() {
      const cells = boardElement.children;
      for (let i = 0; i < cells.length; i++) {
        const row = Math.floor(i / 8);
        const col = i % 8;
        cells[i].textContent = pieces[board[row][col]] || '';
        cells[i].classList.remove('selected');
      }
    }

    createBoard();
  </script></body>
</html>
